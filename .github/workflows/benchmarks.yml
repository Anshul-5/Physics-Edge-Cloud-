name: Benchmarks

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install GCC
        run: sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends gcc g++

      - name: Build benchmarks
        run: |
          python3 -c '
          code = """#include <stdio.h>
          #include <stdlib.h>
          #include <time.h>
          #include "optical_flow.h"

          int main() {
              uint8_t frame[OF_WIDTH * OF_HEIGHT];
              for (int i = 0; i < OF_WIDTH * OF_HEIGHT; i++) frame[i] = rand() % 256;

              optical_flow_ctx_t *ctx = optical_flow_init();
              FlowResult result;

              struct timespec start, end;
              int iterations = 100;

              clock_gettime(CLOCK_MONOTONIC, &start);
              for (int i = 0; i < iterations; i++) {
                  optical_flow_compute(ctx, frame, frame, &result);
              }
              clock_gettime(CLOCK_MONOTONIC, &end);

              double elapsed = (end.tv_sec - start.tv_sec) * 1000.0 +
                              (end.tv_nsec - start.tv_nsec) / 1000000.0;
              double avg_ms = elapsed / iterations;
              double fps = 1000.0 / avg_ms;

              printf("=== Optical Flow Benchmark ===\\n");
              printf("Iterations: %d\\n", iterations);
              printf("Total time: %.2f ms\\n", elapsed);
              printf("Avg per frame: %.3f ms\\n", avg_ms);
              printf("Throughput: %.1f FPS\\n", fps);
              printf("Blocks: %d\\n", NUM_BLOCKS);

              if (avg_ms > 18.0) {
                  printf("FAIL: Exceeded 18ms target (%.3f ms)\\n", avg_ms);
                  return 1;
              }
              printf("PASS: Within 18ms target\\n");

              optical_flow_deinit(ctx);
              return 0;
          }
          """
          with open("bench_optical_flow.cpp", "w") as f: f.write(code)
          '

          g++ -I edge/components/optical_flow/include \
              edge/components/optical_flow/optical_flow.cpp \
              bench_optical_flow.cpp \
              -o bench_optical_flow -lm

      - name: Run benchmarks
        id: benchmark
        run: |
          ./bench_optical_flow 2>&1 | tee benchmark_results.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Comment on PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let results = '';
            let passed = false;
            
            try {
              results = fs.readFileSync('benchmark_results.txt', 'utf8');
              passed = results.includes('PASS');
            } catch {
              results = 'Benchmark failed to run or crashed.';
              passed = false;
            }
            
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';
            
            const latency = results.match(/Avg per frame: ([\d.]+) ms/)?.[1] || 'N/A';
            const fps = results.match(/Throughput: ([\d.]+) FPS/)?.[1] || 'N/A';
            const blocks = results.match(/Blocks: (\d+)/)?.[1] || 'N/A';
            
            const body = `## ${icon} Performance Benchmark Results
            
            **Status: ${status}**
            
            \`\`\`
            ${results}
            \`\`\`
            
            | Metric | Value | Target |
            |--------|-------|--------|
            | Avg Latency | ${latency} ms | < 18 ms |
            | Throughput | ${fps} FPS | > 55 FPS |
            | Blocks | ${blocks} | - |
            
            ${passed ? 'All performance targets met.' : '⚠️ Performance targets not met - review required.'}
            
            <sub>Benchmark run: ${new Date().toISOString()}</sub>`;
            
            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : context.issue.number;
            
            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const existing = comments.find(c => c.body.includes('Performance Benchmark Results'));
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
