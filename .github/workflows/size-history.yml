name: Size History

on:
  push:
    branches: [main]

permissions: read-all

jobs:
  track-size:
    name: Track Source Size
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Track source code size
        run: |
          echo "Commit: $(git rev-parse --short HEAD)" >> size_history.csv
          echo "Date: $(date -u +'%Y-%m-%d')" >> size_history.csv
          
          CPP_LINES=$(find edge \( -name "*.c" -o -name "*.cpp" \) -not -path "*/managed_components/*" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')
          H_LINES=$(find edge -name "*.h" -not -path "*/managed_components/*" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')
          TOTAL_FILES=$(find edge \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) | grep -v managed_components | wc -l)
          
          echo "C/C++ Files Lines: ${CPP_LINES:-0}" >> size_history.csv
          echo "Header Files Lines: ${H_LINES:-0}" >> size_history.csv
          echo "Total Source Files: ${TOTAL_FILES}" >> size_history.csv
          echo "---" >> size_history.csv
          
          echo "C/C++ lines: ${CPP_LINES:-0}, H lines: ${H_LINES:-0}, Files: ${TOTAL_FILES}"

      - name: Upload size history
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: size-history
          path: size_history.csv
          retention-days: 365
