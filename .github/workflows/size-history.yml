name: Size History

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  track-size:
    name: Track Source Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Track source code size
        run: |
          echo "Commit: $(git rev-parse --short HEAD)" >> size_history.csv
          echo "Date: $(date -u +'%Y-%m-%d')" >> size_history.csv
          
          C_LINES=$(find edge -name "*.c" -not -path "*/managed_components/*" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')
          H_LINES=$(find edge -name "*.h" -not -path "*/managed_components/*" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')
          TOTAL_FILES=$(find edge -name "*.c" -o -name "*.h" | grep -v managed_components | wc -l)
          
          echo "C Files Lines: ${C_LINES:-0}" >> size_history.csv
          echo "Header Files Lines: ${H_LINES:-0}" >> size_history.csv
          echo "Total Source Files: ${TOTAL_FILES}" >> size_history.csv
          echo "---" >> size_history.csv
          
          echo "C lines: ${C_LINES:-0}, H lines: ${H_LINES:-0}, Files: ${TOTAL_FILES}"

      - name: Upload size history
        uses: actions/upload-artifact@v7
        with:
          name: size-history
          path: size_history.csv
          retention-days: 365
