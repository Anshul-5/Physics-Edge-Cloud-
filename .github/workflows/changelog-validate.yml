name: Changelog Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Check Changelog Updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changelog was updated
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          
          if git diff --name-only $BASE $HEAD | grep -q "CHANGELOG.md"; then
            echo "CHANGELOG.md was updated"
          else
            PR_TITLE="${{ github.event.pull_request.title }}"
            if echo "$PR_TITLE" | grep -qi "^docs:\|^ci:\|^chore:\|^test:"; then
              echo "No changelog update needed for this PR type"
            else
              echo "WARNING: CHANGELOG.md was not updated"
              echo "Please update CHANGELOG.md with your changes"
              exit 1
            fi
          fi
