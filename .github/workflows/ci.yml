# PhysEdge-Cloud CI Pipeline
# Runs on every push and PR to validate firmware builds and tests

name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Job 1: Lint & Format Check
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck

      - name: Check C formatting
        run: |
          find edge/ -name '*.c' -o -name '*.h' | head -20 | xargs clang-format --dry-run --Werror 2>&1 || true

      - name: Static analysis with cppcheck
        run: |
          cppcheck --enable=warning,style,performance \
                   --suppress=missingIncludeSystem \
                   --error-exitcode=1 \
                   edge/components/ edge/main/ 2>&1 || true

  # ============================================================
  # Job 2: Build ESP32-S3 Firmware (ESP-IDF)
  # ============================================================
  build:
    name: Build ESP32-S3
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup and Build ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.4
          target: esp32s3
          path: 'edge'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32s3-firmware
          path: |
            edge/build/physedge_l1_gate.bin
            edge/build/bootloader/bootloader.bin
            edge/build/partition_table/partition-table.bin
          retention-days: 30
          if-no-files-found: warn

  # ============================================================
  # Job 3: Run Unit Tests (Host-side)
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Compile and run downscaler tests
        run: |
          gcc -I edge/components/downscaler/include \
              edge/components/downscaler/downscaler.c \
              edge/test/test_downscaler.c \
              -o test_downscaler -lm
          ./test_downscaler

      - name: Compile and run optical flow tests
        run: |
          gcc -I edge/components/optical_flow/include \
              edge/components/optical_flow/optical_flow.c \
              edge/test/test_optical_flow.c \
              -o test_optical_flow -lm
          ./test_optical_flow

  # ============================================================
  # Job 4: Documentation Build Check
  # ============================================================
  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all markdown files exist
        run: |
          for f in README.md CHANGELOG.md \
                   docs/system_architecture.md \
                   docs/api_specification.md \
                   docs/security_and_privacy.md \
                   docs/production_runbook.md \
                   docs/development_roadmap.md \
                   docs/mathematical_documentation.md; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
          done
          echo "All docs present"

      - name: Check no broken internal links
        run: |
          grep -rn 'file:///' docs/ README.md && echo "WARNING: local file:// links found" || true
