name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    name: Nightly Build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup and Build ESP-IDF
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.1.4
          target: esp32s3
          path: 'edge'

      - name: Upload nightly build
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: nightly-build-${{ github.run_number }}
          path: |
            edge/build/physedge_l1_gate.bin
            edge/build/bootloader/bootloader.bin
            edge/build/partition_table/partition-table.bin
          retention-days: 7

      - name: Run all tests
        run: |
          g++ --coverage -I edge/components/downscaler/include \
              edge/components/downscaler/downscaler.cpp \
              edge/test/test_downscaler.cpp \
              -o test_downscaler -lm
          ./test_downscaler

          g++ --coverage -I edge/components/optical_flow/include \
              edge/components/optical_flow/optical_flow.cpp \
              edge/test/test_optical_flow.cpp \
              -o test_optical_flow -lm
          ./test_optical_flow
