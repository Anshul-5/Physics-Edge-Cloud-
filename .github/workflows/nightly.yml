name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Nightly Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup and Build ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.4
          target: esp32s3
          path: 'edge'

      - name: Upload nightly build
        uses: actions/upload-artifact@v7
        with:
          name: nightly-build-${{ github.run_number }}
          path: |
            edge/build/physedge_l1_gate.bin
            edge/build/bootloader/bootloader.bin
            edge/build/partition_table/partition-table.bin
          retention-days: 7

      - name: Run all tests
        run: |
          gcc --coverage -I edge/components/downscaler/include \
              edge/components/downscaler/downscaler.c \
              edge/test/test_downscaler.c \
              -o test_downscaler -lm
          ./test_downscaler

          gcc --coverage -I edge/components/optical_flow/include \
              edge/components/optical_flow/optical_flow.c \
              edge/test/test_optical_flow.c \
              -o test_optical_flow -lm
          ./test_optical_flow
