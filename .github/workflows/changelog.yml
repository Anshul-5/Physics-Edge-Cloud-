# Auto-update CHANGELOG.md on PR merge or push to main

name: Update Changelog

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  update-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Skip if not merged PR
        if: github.event_name == 'pull_request' && github.event.pull_request.merged != true
        run: echo "PR not merged, skipping" && exit 0

      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update changelog (PR)
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          TITLE="$PR_TITLE"
          AUTHOR="$PR_AUTHOR"
          NUM="$PR_NUMBER"
          LINK="https://github.com/${{ github.repository }}/pull/$NUM"

          # Determine category from title prefix
          TITLE_LOWER=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]')
          if [[ "$TITLE_LOWER" == feat:* ]]; then CATEGORY="Added"
          elif [[ "$TITLE_LOWER" == fix:* ]]; then CATEGORY="Fixed"
          elif [[ "$TITLE_LOWER" == refactor:* ]]; then CATEGORY="Changed"
          elif [[ "$TITLE_LOWER" == docs:* ]]; then CATEGORY="Documentation"
          elif [[ "$TITLE_LOWER" == ci:* ]] || [[ "$TITLE_LOWER" == chore:* ]]; then CATEGORY="Infrastructure"
          else CATEGORY="Changed"
          fi

          # Clean title
          CLEAN_TITLE=$(echo "$TITLE" | sed -E 's/^(feat|fix|docs|refactor|ci|chore)(\([^)]*\))?!?:[[:space:]]*//')

          # Build entry
          ENTRY="- $CLEAN_TITLE ([$NUM]($LINK)) @$AUTHOR"

          # Add to changelog
          if grep -q "^### $CATEGORY" CHANGELOG.md; then
            sed -i "/^### $CATEGORY$/a\\$ENTRY" CHANGELOG.md
          else
            LINE=$(grep -n "^## \[Unreleased\]" CHANGELOG.md | head -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              sed -i "${LINE}a\\
\\
### $CATEGORY\\
$ENTRY" CHANGELOG.md
            fi
          fi

          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: auto-update changelog"
          git push

      - name: Update changelog (push)
        if: github.event_name == 'push'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TITLE=$(echo "$COMMIT_MSG" | head -n1)
          AUTHOR="$COMMIT_AUTHOR"
          NUM=$(echo "$COMMIT_SHA" | cut -c1-7)
          LINK="https://github.com/${{ github.repository }}/commit/$COMMIT_SHA"

          # Determine category from title prefix
          TITLE_LOWER=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]')
          if [[ "$TITLE_LOWER" == feat:* ]]; then CATEGORY="Added"
          elif [[ "$TITLE_LOWER" == fix:* ]]; then CATEGORY="Fixed"
          elif [[ "$TITLE_LOWER" == refactor:* ]]; then CATEGORY="Changed"
          elif [[ "$TITLE_LOWER" == docs:* ]]; then CATEGORY="Documentation"
          elif [[ "$TITLE_LOWER" == ci:* ]] || [[ "$TITLE_LOWER" == chore:* ]]; then CATEGORY="Infrastructure"
          else CATEGORY="Changed"
          fi

          # Clean title
          CLEAN_TITLE=$(echo "$TITLE" | sed -E 's/^(feat|fix|docs|refactor|ci|chore)(\([^)]*\))?!?:[[:space:]]*//')

          # Build entry
          ENTRY="- $CLEAN_TITLE ([$NUM]($LINK)) @$AUTHOR"

          # Add to changelog
          if grep -q "^### $CATEGORY" CHANGELOG.md; then
            sed -i "/^### $CATEGORY$/a\\$ENTRY" CHANGELOG.md
          else
            LINE=$(grep -n "^## \[Unreleased\]" CHANGELOG.md | head -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              sed -i "${LINE}a\\
\\
### $CATEGORY\\
$ENTRY" CHANGELOG.md
            fi
          fi

          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: auto-update changelog"
          git push
