# Auto-update CHANGELOG.md on push to main

name: Update Changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update changelog
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TITLE=$(echo "$COMMIT_MSG" | head -n1)
          AUTHOR="$COMMIT_AUTHOR"
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          LINK="https://github.com/${{ github.repository }}/commit/$COMMIT_SHA"

          TITLE_LOWER=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]')
          if echo "$TITLE_LOWER" | grep -q "^feat:"; then
            CATEGORY="Added"
          elif echo "$TITLE_LOWER" | grep -q "^fix:"; then
            CATEGORY="Fixed"
          elif echo "$TITLE_LOWER" | grep -q "^docs:"; then
            CATEGORY="Documentation"
          elif echo "$TITLE_LOWER" | grep -q "^ci:\|^chore:"; then
            CATEGORY="Infrastructure"
          else
            CATEGORY="Changed"
          fi

          CLEAN_TITLE=$(echo "$TITLE" | sed 's/^[a-z]*(\([^)]*\))\?:[[:space:]]*//')
          ENTRY="- $CLEAN_TITLE ([$SHORT_SHA]($LINK)) @$AUTHOR"

          if grep -q "^### $CATEGORY" CHANGELOG.md; then
            sed -i "/^### $CATEGORY$/a\\$ENTRY" CHANGELOG.md
          else
            LINE=$(grep -n "## \[Unreleased\]" CHANGELOG.md | head -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              sed -i "${LINE}a\\
\\
### $CATEGORY\\
$ENTRY" CHANGELOG.md
            fi
          fi

          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: auto-update changelog [skip ci]"
          git push
