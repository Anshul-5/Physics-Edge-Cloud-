# Auto-update CHANGELOG.md on PR merge or push to main
# Extracts commit/PR info to categorize changelog entries

name: Update Changelog

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  update-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    # Run on PR merge OR direct push
    if: >
      (github.event_name == 'push') ||
      (github.event.pull_request.merged == true)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract info and update changelog
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Determine title and author based on event type
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TITLE="$PR_TITLE"
            AUTHOR="$PR_AUTHOR"
            NUM="$PR_NUMBER"
            LINK="https://github.com/${{ github.repository }}/pull/$NUM"
          else
            # Direct push: extract title from commit message
            TITLE=$(echo "$COMMIT_MSG" | head -n1)
            AUTHOR="$COMMIT_AUTHOR"
            NUM=$(echo "$COMMIT_SHA" | cut -c1-7)
            LINK="https://github.com/${{ github.repository }}/commit/$COMMIT_SHA"
          fi

          # Determine category from title prefix
          TITLE_LOWER=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]')
          if [[ "$TITLE_LOWER" == feat:* ]] || [[ "$TITLE_LOWER" == feature:* ]]; then
            CATEGORY="Added"
          elif [[ "$TITLE_LOWER" == fix:* ]] || [[ "$TITLE_LOWER" == bugfix:* ]]; then
            CATEGORY="Fixed"
          elif [[ "$TITLE_LOWER" == refactor:* ]]; then
            CATEGORY="Changed"
          elif [[ "$TITLE_LOWER" == docs:* ]] || [[ "$TITLE_LOWER" == documentation:* ]]; then
            CATEGORY="Documentation"
          elif [[ "$TITLE_LOWER" == perf:* ]] || [[ "$TITLE_LOWER" == performance:* ]]; then
            CATEGORY="Performance"
          elif [[ "$TITLE_LOWER" == test:* ]] || [[ "$TITLE_LOWER" == tests:* ]]; then
            CATEGORY="Testing"
          elif [[ "$TITLE_LOWER" == ci:* ]] || [[ "$TITLE_LOWER" == chore:* ]]; then
            CATEGORY="Infrastructure"
          else
            CATEGORY="Changed"
          fi

          # Clean title: remove conventional commit prefix
          CLEAN_TITLE=$(echo "$TITLE" | sed -E 's/^(feat|fix|docs|refactor|perf|test|ci|chore|build|style|revert)(\([^)]*\))?!?:[[:space:]]*//')

          # Build the changelog entry
          ENTRY="- $CLEAN_TITLE ([$NUM]($LINK)) @$AUTHOR"

          # Check if [Unreleased] section exists, if not create it
          if ! grep -q "## \[Unreleased\]" CHANGELOG.md; then
            echo -e "# Changelog\n\nAll notable changes to PhysEdge-Cloud will be documented in this file.\n\nFormat based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).\n\n---\n\n## [Unreleased]\n\n### Added\n- Initial unreleased entries\n\n---" > CHANGELOG.md.tmp
            cat CHANGELOG.md >> CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
          fi

          # Find the category under [Unreleased] and insert
          if grep -q "^### $CATEGORY" CHANGELOG.md; then
            # Category exists - insert after the header line
            sed -i "/^### $CATEGORY$/a\\$ENTRY" CHANGELOG.md
          else
            # Category doesn't exist under Unreleased - add it
            UNRELEASED_LINE=$(grep -n "^## \[Unreleased\]" CHANGELOG.md | head -1 | cut -d: -f1)
            if [ -n "$UNRELEASED_LINE" ]; then
              sed -i "${UNRELEASED_LINE}a\\
\\
### $CATEGORY\\
$ENTRY" CHANGELOG.md
            fi
          fi

          # Commit if there are changes
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: auto-update changelog"
          git push
