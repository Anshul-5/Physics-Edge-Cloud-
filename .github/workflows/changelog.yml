name: Changelog
on:
  push:
    branches: [main]
jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Update changelog
        run: |
          MSG=$(git log -1 --pretty=%B)
          AUTHOR=$(git log -1 --pretty=%an)
          SHA=$(git rev-parse --short HEAD)
          REPO=${{ github.repository }}
          URL="https://github.com/$REPO/commit/$SHA"
          
          if echo "$MSG" | grep -qi "^feat:"; then CAT="Added"
          elif echo "$MSG" | grep -qi "^fix:"; then CAT="Fixed"
          elif echo "$MSG" | grep -qi "^docs:"; then CAT="Documentation"
          elif echo "$MSG" | grep -qi "^ci:"; then CAT="Infrastructure"
          else CAT="Changed"
          fi
          
          ENTRY="- $MSG ([$SHA]($URL)) @$AUTHOR"
          echo "Adding: $ENTRY to $CAT"
          
          if grep -q "^### $CAT" CHANGELOG.md; then
            sed -i "/^### $CAT$/a $ENTRY" CHANGELOG.md
          else
            N=$(grep -n "Unreleased" CHANGELOG.md | head -1 | cut -d: -f1)
            if [ -n "$N" ]; then
              sed -i "${N}a\\
\\
### $CAT\\
$ENTRY" CHANGELOG.md
            fi
          fi
          
          echo "--- Updated CHANGELOG.md ---"
          head -30 CHANGELOG.md
          echo "---"
          
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update changelog [skip ci]"
            git push
          fi
