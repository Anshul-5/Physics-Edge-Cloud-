name: Update Changelog
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update changelog
        env:
          MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          TITLE=$(echo "$MSG" | head -n1)
          SHORT=$(echo "$SHA" | cut -c1-7)
          URL="https://github.com/${{ github.repository }}/commit/$SHA"

          if echo "$TITLE" | grep -qi "^feat:"; then CAT="Added"
          elif echo "$TITLE" | grep -qi "^fix:"; then CAT="Fixed"
          elif echo "$TITLE" | grep -qi "^docs:"; then CAT="Documentation"
          elif echo "$TITLE" | grep -qi "^ci:"; then CAT="Infrastructure"
          elif echo "$TITLE" | grep -qi "^chore:"; then CAT="Infrastructure"
          else CAT="Changed"
          fi

          ENTRY="- $TITLE ([$SHORT]($URL)) @$AUTHOR"

          if grep -q "^### $CAT" CHANGELOG.md; then
            sed -i "/^### $CAT$/a $ENTRY" CHANGELOG.md
          else
            N=$(grep -n "Unreleased" CHANGELOG.md | head -1 | cut -d: -f1)
            if [ -n "$N" ]; then
              sed -i "${N}a\\
\\
### $CAT\\
$ENTRY" CHANGELOG.md
            fi
          fi

          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs: auto-update changelog"
            git push
          fi
