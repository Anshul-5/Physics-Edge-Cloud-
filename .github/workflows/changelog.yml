name: Changelog
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update changelog
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            const msg = execSync('git log -1 --pretty=%B').toString().trim();
            const author = execSync('git log -1 --pretty=%an').toString().trim();
            const sha = context.sha.substring(0, 7);
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            
            let cat = 'Changed';
            if (/^feat:/i.test(msg)) cat = 'Added';
            else if (/^fix:/i.test(msg)) cat = 'Fixed';
            else if (/^docs:/i.test(msg)) cat = 'Documentation';
            else if (/^ci:|^chore:/i.test(msg)) cat = 'Infrastructure';
            
            const entry = `- ${msg} ([${sha}](${url})) @${author}`;
            console.log(`Adding: ${entry} to ${cat}`);
            
            let content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const header = `### ${cat}`;
            
            if (content.includes(header)) {
              const lines = content.split('\n');
              const idx = lines.findIndex(l => l.trim() === header);
              if (idx >= 0) {
                lines.splice(idx + 1, 0, entry);
                content = lines.join('\n');
              }
            } else {
              const unreleasedIdx = content.indexOf('## [Unreleased]');
              if (unreleasedIdx >= 0) {
                const insertAt = content.indexOf('\n', unreleasedIdx) + 1;
                content = content.slice(0, insertAt) + `\n\n${header}\n${entry}` + content.slice(insertAt);
              }
            }
            
            fs.writeFileSync('CHANGELOG.md', content);
            console.log('Updated CHANGELOG.md');
            
            execSync('git add CHANGELOG.md');
            try {
              execSync('git diff --cached --quiet', { stdio: 'pipe' });
              console.log('No changes');
            } catch {
              execSync('git commit -m "docs: update changelog [skip ci]"');
              execSync('git push');
            }
