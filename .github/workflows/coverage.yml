name: Code Coverage

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, 'feat/**', 'fix/**']

permissions: read-all

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends gcc g++ lcov

      - name: Compile and run tests with coverage
        run: |
          g++ --coverage -I edge/components/jerk_baseline/include \
              edge/components/jerk_baseline/jerk_baseline.cpp \
              edge/test/test_jerk_baseline.cpp \
              -o test_jerk_baseline -lm
          ./test_jerk_baseline

          g++ --coverage -I edge/components/uplink_buffer/include \
              edge/components/uplink_buffer/uplink_buffer.cpp \
              edge/test/test_uplink_buffer.cpp \
              -o test_uplink_buffer -lm
          ./test_uplink_buffer

          g++ --coverage -I edge/components/downscaler/include \
              edge/components/downscaler/downscaler.cpp \
              edge/test/test_downscaler.cpp \
              -o test_downscaler -lm
          ./test_downscaler

          g++ --coverage -I edge/components/optical_flow/include \
              edge/components/optical_flow/optical_flow.cpp \
              edge/test/test_optical_flow.cpp \
              -o test_optical_flow -lm
          ./test_optical_flow

          g++ --coverage -I edge/components/homography/include \
              edge/components/homography/homography.cpp \
              edge/test/test_homography.cpp \
              -o test_homography -lm
          ./test_homography

          g++ --coverage -I edge/components/ota_security/include \
              edge/components/ota_security/ota_security.c \
              edge/test/test_ota_security.cpp \
              -o test_ota_security -lm
          ./test_ota_security

      - name: Generate coverage report
        run: |
          lcov --capture --directory . --output-file coverage.info 2>/dev/null || true
          lcov --remove coverage.info '/usr/*' 'edge/test/*' --output-file coverage_filtered.info 2>/dev/null || true
          lcov --list coverage_filtered.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage_filtered.info
          flags: unittests
          name: physedge-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
