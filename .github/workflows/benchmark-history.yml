name: Benchmark History

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

permissions: read-all

jobs:
  track-history:
    name: Track Benchmark History
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'push' || (github.event.pull_request.merged == true)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record benchmark results
        run: |
          echo "Recording benchmark data for commit $(git rev-parse --short HEAD)"
          echo "Commit: $(git rev-parse --short HEAD)" >> benchmark_history.txt
          echo "Date: $(date -u +'%Y-%m-%d %H:%M UTC')" >> benchmark_history.txt
          echo "Author: ${{ github.actor }}" >> benchmark_history.txt
          echo "---" >> benchmark_history.txt
          cat benchmark_history.txt

      - name: Upload benchmark history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-history
          path: benchmark_history.txt
          retention-days: 365
