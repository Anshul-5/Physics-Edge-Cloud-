# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # ESP-IDF components (via idf_component.yml)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"

  # pip (for any Python tooling)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
    # Packages with exact cross-pins must move together in one PR
    groups:
      pytorch:
        patterns: ["torch", "torchvision"]
      grpc:
        patterns: ["grpcio", "grpcio-tools", "protobuf"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
